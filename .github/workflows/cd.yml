name: CD - Deployment Pipeline

on:
  workflow_run:
    workflows: ["Android CI"]
    types:
      - completed

jobs:

  build-dev-apk:
    name: Build Dev APK
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'development' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Dev Release APK
        run: ./gradlew assembleDevRelease

      - name: Upload Dev APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dev-App-Build
          path: app/build/outputs/apk/dev/release/*.apk

  build-prod-apk:
    name: Build Prod APK
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Prod Release APK
        run: ./gradlew assembleProdRelease

      - name: Upload Prod APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prod-App-Build
          path: app/build/outputs/apk/prod/release/*.apk
