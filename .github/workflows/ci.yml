# CI — Pull Request Check Pipeline
# Runs on every Pull Request to development or master branches.
# Validates code, unit tests, UI tests, and builds in separate jobs for clear PR status reporting.

name: CI - PR Check

on:
  pull_request:
    branches: [ "development", "master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB: UNIT TESTS
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Dev Unit Tests
        run: ./gradlew testDevDebugUnitTest --no-daemon

      - name: Run Prod Unit Tests
        run: ./gradlew testProdDebugUnitTest --no-daemon

  # JOB: UI TESTS
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: ./gradlew connectedDevDebugAndroidTest --no-daemon

  #  JOB: BUILD CHECKS
  build-checks:
    name: Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Dev Debug APK Check
        run: ./gradlew assembleDevDebug --no-daemon

      - name: Build Prod Debug APK Check
        run: ./gradlew assembleProdDebug --no-daemon
