# CI — Pull Request Check Pipeline
# Runs on every Pull Request to development or master branches.
# Validates code and unit tests for BOTH Dev and Prod environments before merging.

name: CI - PR Check

on:
  pull_request:
    branches: [ "development", "master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Dev Unit Tests
        run: ./gradlew testDevDebugUnitTest --no-daemon

      - name: Run Prod Unit Tests
        run: ./gradlew testProdDebugUnitTest --no-daemon

      - name: Run UI Tests on Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          script: ./gradlew connectedDevDebugAndroidTest --no-daemon

      - name: Build Dev Debug APK Check
        run: ./gradlew assembleDevDebug --no-daemon

      - name: Build Prod Debug APK Check
        run: ./gradlew assembleProdDebug --no-daemon


