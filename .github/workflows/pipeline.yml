name: Pipeline

on:
  push:
    branches: [ "development", "master" ]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon


  deploy-dev:
    name: Deploy Dev Release APK
    needs: test
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Dev Release APK
        run: ./gradlew assembleDevRelease --no-daemon

      - name: Upload Dev Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dev-Release-APK
          path: app/build/outputs/apk/dev/release/*.apk

  deploy-prod:
    name: Deploy Prod Release APK
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Prod Release APK
        run: ./gradlew assembleProdRelease --no-daemon

      - name: Upload Prod Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Prod-Release-APK
          path: app/build/outputs/apk/prod/release/*.apk
